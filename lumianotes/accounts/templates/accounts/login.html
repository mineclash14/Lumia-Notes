{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Lumia Notes</title>
    <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
    <link rel="icon" type="image/png" href="{% static 'notes/images/favicon.png' %}">
    <link rel="apple-touch-icon" href="{% static 'notes/images/favicon.png' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="popup" id="popup"></div>

        <div class="login-header">
            <img src="{% static 'accounts/images/logo.png' %}" alt="Lumia Notes Logo">
            <h1>Login</h1>
            <p>Welcome back! To access your notes, please enter your credentials.</p>
        </div>

        <form method="POST" action="{% url 'login' %}" id="login-form">
            {% csrf_token %}
            <input type="text" id="username" name="username" placeholder="Username" required>
            
            <div class="password-container">
                <input type="password" id="password" name="password" placeholder="Password" minlength="8" required>
                <i class="fa-solid fa-eye showEye"></i>
            </div>

            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    </div>

    <script src="{% static 'accounts/js/login.js' %}"></script>

    {% if error %}
        <script>
            mostrarPopup("{{ error|escapejs }}", "error");
        </script>
    {% endif %}

    {% if messages %}
        {% for message in messages %}
            <script>
                mostrarPopup("{{ message|escapejs }}", "success");
            </script>
        {% endfor %}
    {% endif %}
    
</body>
</html>
