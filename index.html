<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="toast"></div>
    <aside id="sidebar">
        <div id="logo-container">
            <img src="logo.png" alt="Logo" id="logo">
            <h3>Lumina Notes</h3>
        </div>

        <div id="sidebar-content">
            <nav id="sidebar-nav">
                <ul>
                    <li><button class="navbtn" id="notas"><i class="fa-regular fa-note-sticky"></i> Notas</button></li>
                    <li><button class="navbtn" id="favoritos"><i class="fa-regular fa-star"></i> Favoritos</button></li>
                    <li><button class="navbtn" id="arquivadas"><i class="fa-regular fa-folder"></i> Arquivadas</button></li>
                </ul>
            </nav>

            <div id="folders-container">
                <button id="add-folder">PASTAS <i class="fa-solid fa-plus"></i></button>
            </div>
        </div>

        <div id="settings-container">
            <button class="settings"><i class="fa-solid fa-gear"></i></button>
            <p>Configurações</p>
        </div>
    </aside>


    <div id="main-content">
        <header class="headers">
            <div>
                <input type="text" placeholder="Pesquisar..." id="search">
            </div>
            <div id="header-nav">
                <ul>
                    <li><button id="notificacoes"><i class="fa-regular fa-bell"></i></button></li>
                    <li><button class="settings"><i class="fa-solid fa-gear"></i></button></li>
                    <li><div class="divider"></div></li>
                    <li><button id="header-new-note" class="new-note"><i class="fa-solid fa-plus"></i> Nova Nota</button></li>
                    <li id="perfil-container">
                        <img src="image.png" alt="Perfil" id="profile-picture">
                        <label for="perfil-config-btn">
                            <input type="checkbox" id="perfil-config-btn">
                            <i class="fa-solid fa-chevron-down"></i>
                        </label>
                    </li>
                    <div id="perfil-config">
                        <ul>
                            <li><button id="perfil"><i class="fa-regular fa-user"></i> Perfil</button></li>
                            <hr>
                            <li><button id="sair"><i class="fa-solid fa-right-from-bracket"></i> Sair</button></li>
                        </ul>
                    </div>
                </ul>
            </div>
        </header>

        <main>
            <section id="notes-container">
                <div id="header-notes" class="headers">
                    <div>
                        <h1>Notas</h1>
                        <p>Updated 5 minutes ago</p>
                    </div>
                    <div id="header-notes-nav">
                        <ul>
                            <li id="view-mode">
                                <button id="grid-view-btn"><i class="fa-solid fa-border-all"></i></button>
                                <button id="list-view-btn"><i class="fa-solid fa-list"></i></button>
                            </li>
                        </ul>
                    </div>
                </div>
                <div id="notes-wrapper">
                    <div id="notes-list"></div>

                    <div id="new-draft">
                        <button id="main-new-note" class="new-note">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <h3>Nova Nota</h3>
                    </div>
                </div>
            </section>

            <section id="notes-editor">
                <div id="editor-header" class="headers">
                    <div id="editor-header-left">
                        <button id="editor-return-btn" class="return-btn"><i class="fa-solid fa-arrow-left"></i></button>
                        <div class="note-tags" id="editor-tags-container">
                            
                        </div>    
                    </div>
                    <div id="editor-header-nav">
                        <ul>
                            <li><button class="note-delete" id="editor-note-delete"><i class="fa-solid fa-trash"></i> Deletar</button></li>
                            <li><div class="divider"></div></li>
                            <li><button id="save-btn"><i class="fa-regular fa-floppy-disk"></i> Salvar Alterações</button></li>
                        </ul>
                    </div>
                </div>
                <div id="editor-toolbar-container">
                    <ul id="editor-toolbar">
                        <li><button title="Título 1" id="title-h1-btn">H<sub>1</sub></button></li>
                        <li><button title="Título 2" id="title-h2-btn">H<sub>2</sub></button></li>

                        <li><div class="divider"></div></li>

                        <li><button title="Negrito" id="bold-btn"><i class="fa-solid fa-bold"></i></button></li>
                        <li><button title="Itálico" id="italic-btn"><i class="fa-solid fa-italic"></i></button></li>
                        <li><button title="Código" id="code-btn"><i class="fa-solid fa-code"></i></button></li>

                        <li><div class="divider"></div></li>

                        <li><button title="Lista" id="list-btn"><i class="fa-solid fa-list"></i></button></li>
                        <li><button title="Lista numerada" id="list-ol-btn"><i class="fa-solid fa-list-ol"></i></button></li>
                        <li><button title="Citação" id="quote-btn"><i class="fa-solid fa-quote-right"></i></button></li>

                        <li><div class="divider"></div></li>

                        <li>
                            <label for="image-btn" id="label-image-btn">
                                <input type="checkbox" id="image-btn">
                                <i class="fa-regular fa-image"></i>
                            </label>
                        </li>

                        
                        <li>
                            <label for="tag-btn" id="label-tag-btn">
                                <input type="checkbox" id="tag-btn">
                                <i class="fa-solid fa-tags"></i>
                            </label>
                        </li>

                        <div id="image-insert-container">
                            <div class="form-group">
                                <label for="description">Descrição: </label>
                                <input type="text" name="description" id="img-alt">
                            </div>
                            <div class="form-group">
                                <label for="url">URL da imagem: </label>
                                <input type="url" name="url" id="img-url" placeholder="Ex.: https://site.com/foto.jpg">
                            </div>
                            <div id="image-insert-actions">
                                <button id="cancel-image-insert"><i class="fa-regular fa-circle-xmark"></i> Cancelar</button>
                                <button id="image-insert"><i class="fa-solid fa-arrow-up-from-bracket"></i> Inserir</button>
                            </div>
                        </div>

                        <div id="tags-insert-container">
                            <div class="form-group">
                                <label for="tag-insert-input">Tag: </label>
                                <input type="text" id="tag-insert-input" placeholder="Ex.: JavaScript">
                            </div>
                            <div id="tags-insert-view">
                                <button id="tag-insert"><i class="fa-solid fa-arrow-up-from-bracket"></i> Inserir</button>
                            </div>
                        </div>
                    </ul>
                </div>
                <div id="text-editor-container">
                    <input type="text" id="title" placeholder="Title" required>
                    <textarea name="content" id="text-content" placeholder="Text" required></textarea>
                </div>
            </section>

            <section id="view-note-container">
                <div id="view-note-header" class="headers">
                    <div id="view-note-header-info">
                        <button id="view-return-btn" class="return-btn">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>

                        <div id="view-note-info">
                            <div class="note-tags">
                                <span class="tag"></span>
                                <span class="tag"></span>
                            </div>
                            <p class="note-date"></p>
                        </div>
                    </div>
                    <div id="view-note-nav">
                        <ul>
                            <li><button class="note-delete" id="view-note-delete"><i class="fa-solid fa-trash"></i> Deletar</button></li>
                            <li><button class="note-edit" id="view-note-edit"><i class="fa-regular fa-edit"></i> Editar</button></li>
                        </ul>
                    </div>
                </div>
                <div id="view-note">
                    <h1 id="view-note-title" class="note-title"></h1>
                    <div id="view-note-content" class="note-content"></div>
                </div>
            </section>
            <section id="statistics-container">
                <div class="statistics">
                    <div class="statistic-icon notes-icon"><i class="fa-regular fa-file-lines" style="color: rgb(116, 192, 252);"></i></div>
                    <div class="statistic-content">
                        <p>Conteúdo total</p>
                        <div class="statistic-info">
                            <h2 class="statistic-value">0</h2>
                            <h2 class="statistic-title">Notas</h2>
                        </div>
                    </div>
                </div>
                <div class="statistics">
                    <div class="statistic-icon favorito-icon"><i class="fa-regular fa-star" style="color: rgb(255, 212, 59);"></i></div>
                    <div class="statistic-content">
                        <p>Favoritas</p>
                        <div class="statistic-info">
                            <h2 class="statistic-value">0</h2>
                            <h2 class="statistic-title">Items</h2>
                        </div>
                    </div>
                </div>
                <div class="statistics">
                    <div class="statistic-icon archive-icon"><i class="fa-solid fa-box-archive" style="color: rgb(8, 167, 118);"></i></div>
                    <div class="statistic-content">
                        <p>Arquivadas</p>
                        <div class="statistic-info">
                            <h2 class="statistic-value">0</h2>
                            <h2 class="statistic-title">Items</h2>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Lumina Notes. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="https://kit.fontawesome.com/39feeee0ae.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
